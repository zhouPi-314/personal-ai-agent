<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAA 维护控制台</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07080b;
    --base: #0b0d11;
    --card: #101319;
    --line: #1d222b;
    --line-strong: #2a3140;
    --fg: #e8eaee;
    --muted: #8a93a3;
    --accent: #5e6ad2;
    --ok: #35c46b;
    --bad: #ef5b5b;
    --warn: #e0a13a;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.65 system-ui, "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(94,106,210,.14), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, rgba(94,106,210,.08), transparent 55%),
      var(--bg);
    color: var(--fg);
    min-height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
    background: rgba(8,9,12,.86); backdrop-filter: blur(10px);
  }
  .brand { display: flex; flex-direction: column; line-height: 1.25; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .brand small { color: var(--muted); font-size: 11px; }
  .spacer { flex: 1; }
  input, button {
    font: inherit; border-radius: 8px; border: 1px solid var(--line-strong);
    background: var(--card); color: var(--fg); padding: 7px 11px;
    transition: border-color .15s ease, background .15s ease;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; }
  button:hover { border-color: #3d4658; background: #141822; }
  button.active { background: rgba(94,106,210,.18); border-color: #4a55b8; color: #cfd4ff; }
  .seg { display: flex; gap: 0; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 12px; background: transparent; font-size: 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.active { background: rgba(94,106,210,.22); color: #dfe2ff; }
  main { padding: 20px; max-width: 1120px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .card { background: linear-gradient(180deg, #11141b, var(--card)); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card b { display: block; font: 600 23px/1.2 var(--mono); letter-spacing: -.5px; }
  .card span { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  nav button { font-size: 13px; padding: 6px 12px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; }
  .item:hover { border-color: var(--line-strong); }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .meta .num { font-family: var(--mono); }
  .chip { border: 1px solid var(--line-strong); border-radius: 999px; padding: 0 8px; font-size: 11px; color: var(--muted); }
  .chip.local { border-color: #1f5137; color: #7fe0a6; }
  .chip.cloud { border-color: #5a4118; color: #f0c274; }
  .content { white-space: pre-wrap; word-break: break-word; }
  .empty { color: #5f6775; text-align: center; padding: 28px; }
  .err { color: #ff9c9c; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .pill { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #58606e; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(53,196,107,.12); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(239,91,91,.12); }
  .pill small { color: var(--muted); font-family: var(--mono); }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>PAA 维护控制台</h1>
    <small>Personal AI Agent · 本机运维</small>
  </div>
  <span class="spacer"></span>
  <div class="seg" id="route">
    <button data-mode="auto">自动</button>
    <button data-mode="primary">本地</button>
    <button data-mode="fallback">云端</button>
  </div>
  <input id="token" placeholder="访问令牌（未设置可留空）" size="24">
  <button id="save">保存</button>
  <button id="reload">刷新</button>
</header>

<main>
  <div class="pills" id="health"></div>
  <div class="cards" id="cards"></div>
  <nav id="tabs">
    <button data-tab="messages" class="active">会话</button>
    <button data-tab="memories">记忆</button>
    <button data-tab="tasks">任务</button>
    <button data-tab="audit">审计</button>
    <button data-tab="tts">语音</button>
    <button data-tab="model">模型</button>
  </nav>
  <section id="list"><div class="empty">加载中…</div></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const state = { tab: "messages", token: localStorage.getItem("paa-token") || "" };

$("token").value = state.token;
$("save").onclick = () => {
  state.token = $("token").value.trim();
  localStorage.setItem("paa-token", state.token);
  load();
};
$("reload").onclick = load;

document.querySelectorAll("#tabs button").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    state.tab = btn.dataset.tab;
    load();
  };
});

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (state.token) headers["X-PAA-Token"] = state.token;
  const res = await fetch(path, { ...options, headers });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function time(iso) {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("zh-CN", { hour12: false });
}

async function loadStatus() {
  try {
    const [s, u] = await Promise.all([api("/api/status"), api("/api/usage")]);
    const cards = Object.entries(s).map(([k, v]) =>
      `<div class="card"><b>${v}</b><span>${esc(label(k))}</span></div>`).join("");
    const cost = u.today_cost === null ? "未知" : `¥${Number(u.today_cost).toFixed(2)}`;
    const quotaCard = u.quota > 0
      ? `<div class="card"><b>${u.remaining}</b><span>今日剩余额度</span></div>`
      : "";
    $("cards").innerHTML = cards +
      `<div class="card"><b>${u.today_total}</b><span>今日 token</span></div>` +
      `<div class="card"><b>${cost}</b><span>今日费用</span></div>` + quotaCard;
  } catch (e) {
    $("cards").innerHTML = `<div class="err">状态读取失败：${esc(e.message)}</div>`;
  }
}

async function loadHealth() {
  try {
    const h = await api("/api/health");
    $("health").innerHTML = h.items.map((item) => {
      const cls = item.ok === true ? "ok" : item.ok === false ? "bad" : "";
      const extra = item.latency_ms ? `${item.latency_ms}ms` : (item.detail || "");
      const title = item.detail ? ` title="${esc(item.detail)}"` : "";
      return `<span class="pill"${title}><span class="dot ${cls}"></span>${esc(item.label)}
              <small>${esc(extra)}</small></span>`;
    }).join("");
  } catch (e) {
    $("health").innerHTML = `<span class="err">连通性检查失败：${esc(e.message)}</span>`;
  }
}

function label(k) {
  return { messages: "消息", memories: "记忆", tasks: "任务", audit_logs: "审计" }[k] || k;
}

function row(meta, body, actions = "") {
  return `<div class="item"><div class="meta">${meta}</div>
          <div class="content">${body}</div>${actions}</div>`;
}

async function loadMessages() {
  const rows = await api("/api/messages?limit=50");
  if (!rows.length) return `<div class="empty">还没有消息</div>`;
  return rows.map((m) => {
    const who = m.role === "user" ? "你" : "她";
    const chip = m.provider
      ? `<span class="chip ${m.provider === "primary" ? "local" : "cloud"}">${m.provider === "primary" ? "本地" : "云端"}</span>`
      : "";
    return row(
      `<span>#${m.id}</span><span>${who}</span><span class="chip">${esc(m.source)}</span>${chip}
       <span>${time(m.created_at)}</span><span>in ${m.input_tokens} / out ${m.output_tokens}</span>`,
      esc(m.content));
  }).join("");
}

async function loadMemories() {
  const rows = await api("/api/memories?limit=100");
  if (!rows.length) return `<div class="empty">还没有记忆</div>`;
  return rows.map((m) => row(
    `<span class="chip">${esc(m.kind)}</span><span>置信度 ${(m.confidence ?? 0).toFixed(2)}</span>
     <span>${time(m.created_at)}</span>`,
    esc(m.content),
    `<div style="margin-top:8px"><button class="danger" data-revoke="${esc(m.id)}">撤销</button></div>`
  )).join("");
}

async function loadTasks() {
  const rows = await api("/api/tasks?limit=50");
  if (!rows.length) return `<div class="empty">还没有任务</div>`;
  return rows.map((t) => row(
    `<span class="chip">${esc(t.status)}</span><span>${time(t.created_at)}</span>`,
    esc(t.title) + (t.error ? `\n<span class="err">${esc(t.error)}</span>` : "")
  )).join("");
}

async function loadAudit() {
  const rows = await api("/api/audit?limit=100");
  if (!rows.length) return `<div class="empty">还没有审计记录</div>`;
  return rows.map((a) => row(
    `<span>#${a.id}</span><span>${esc(a.actor)}</span><span>${esc(a.action)}</span>
     <span class="chip">${esc(a.verdict)}</span><span>${time(a.created_at)}</span>`,
    esc(a.detail || a.target || "")
  )).join("");
}

async function loadTts() {
  const d = await api("/api/media/tts");
  const options = (d.voices || []).map((v) =>
    `<option value="${esc(v)}"${v === d.voice ? " selected" : ""}>${esc(v)}</option>`
  ).join("");
  return `<div class="card" style="max-width:560px">
    <div style="margin-bottom:10px"><b>语音合成</b>
      <span class="chip">${esc(d.provider)}</span>
      <span class="chip">${d.enabled ? "已启用" : "未启用"}</span>
      <span class="chip">${esc(d.mode)}</span></div>
    <label style="display:block;margin:10px 0">音色
      <select id="tts-voice">${options || '<option value="">（无可用音色）</option>'}</select></label>
    <label style="display:block;margin:10px 0">语速
      <input id="tts-speed" type="range" min="${d.speed_range[0]}" max="${d.speed_range[1]}"
             step="0.05" value="${d.speed}">
      <span id="tts-speed-val">${d.speed.toFixed(2)}</span></label>
    <button id="tts-preview">试听</button>
    <button id="tts-save">保存</button>
    <div id="tts-status" style="margin-top:10px;color:#9aa4b2"></div>
    <audio id="tts-audio" controls style="width:100%;margin-top:12px;display:none"></audio>
    <div style="margin-top:14px;color:#9aa4b2;font-size:12px">
      语速 &lt;1 更慢更稳，&gt;1 更快。改完点保存，之后 QQ 语音回复会立刻用它。
    </div>
  </div>`;
}

function bindTts() {
  const slider = $("tts-speed");
  if (!slider) return;
  slider.oninput = () => { $("tts-speed-val").textContent = Number(slider.value).toFixed(2); };
  $("tts-preview").onclick = async () => {
    $("tts-status").textContent = "合成中…（首次约 5 秒，之后约 1 秒）";
    try {
      const res = await fetch("/api/media/tts/preview", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(state.token ? { "X-PAA-Token": state.token } : {}) },
        body: JSON.stringify({ voice: $("tts-voice").value, speed: Number(slider.value) }),
      });
      if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
      const blob = await res.blob();
      const audio = $("tts-audio");
      audio.src = URL.createObjectURL(blob);
      audio.style.display = "block";
      audio.play();
      $("tts-status").textContent = "合成完成，可以直接播放。";
    } catch (e) { $("tts-status").textContent = `试听失败：${e.message}`; }
  };
  $("tts-save").onclick = async () => {
    try {
      await api("/api/media/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ voice: $("tts-voice").value, speed: Number(slider.value) }),
      });
      $("tts-status").textContent = "已保存。";
    } catch (e) { $("tts-status").textContent = `保存失败：${e.message}`; }
  };
}

async function loadModel() {
  const d = await api("/api/model/route");
  const chips = [
    ["primary", "本地 " + esc(d.primary_model || "-"), d.primary_healthy ? "local" : "cloud"],
    ["fallback", "云端 " + esc(d.fallback_model || "-"), d.cloud_configured ? "cloud" : "local"],
  ].map(([, label, cls]) => `<span class="chip ${cls}">${label}</span>`).join("");
  return `<div class="card" style="max-width:560px">
    <div style="margin-bottom:10px"><b>模型路由</b></div>
    <div class="meta">${chips}</div>
    <div class="hint" style="margin-top:10px">
      当前模式：<b>${esc(d.mode)}</b>（auto = 本地优先、失败自动降级；primary = 只用本地；fallback = 只用云端）
    </div>
  </div>`;
}

const loaders = {
  messages: loadMessages, memories: loadMemories, tasks: loadTasks,
  audit: loadAudit, tts: loadTts, model: loadModel,
};

async function loadRoute() {
  try {
    const d = await api("/api/model/route");
    document.querySelectorAll("#route button").forEach((b) => {
      b.classList.toggle("active", b.dataset.mode === d.mode);
    });
  } catch (e) {
    document.querySelectorAll("#route button").forEach((b) => b.classList.remove("active"));
  }
}

document.querySelectorAll("#route button").forEach((btn) => {
  btn.onclick = async () => {
    try {
      await api("/api/model/route", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mode: btn.dataset.mode }),
      });
      await loadRoute();
    } catch (e) { alert("切换失败：" + e.message); }
  };
});

async function load() {
  await loadHealth();
  await loadStatus();
  await loadRoute();
  try {
    $("list").innerHTML = await loaders[state.tab]();
    if (state.tab === "tts") bindTts();
    document.querySelectorAll("[data-revoke]").forEach((btn) => {
      btn.onclick = async () => {
        if (!confirm("撤销后这条记忆不再参与对话，确定？")) return;
        try {
          await api(`/api/memories/${btn.dataset.revoke}/revoke`, { method: "POST" });
          load();
        } catch (e) { alert(`撤销失败：${e.message}`); }
      };
    });
  } catch (e) {
    $("list").innerHTML = `<div class="err">加载失败：${esc(e.message)}</div>`;
  }
}

load();
setInterval(loadHealth, 15000);
setInterval(loadStatus, 15000);
</script>
</body>
</html>
