[project]
name = "paa"
version = "0.1.0"
description = "Personal AI Agent — 单用户、可迁移的私人智能体"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
# migrations/ 是 Alembic 生成的文件，风格不由我们控制
exclude = ["migrations"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
